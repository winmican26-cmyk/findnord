# Railway configuration for FindNord
# This file configures the deployment on Railway with persistent volumes

[build]
  builder = "nixpacks"
  buildCommand = "npm ci"

[deploy]
  startCommand = "node scripts/server.js"
  healthcheckPath = "/"
  healthcheckTimeout = 300
  restartPolicyType = "on_failure"
  restartPolicyMaxRetries = 10

# Persistent volumes for SQLite database and uploaded images
# These directories will survive redeploys and container restarts
[[volumes]]
  name = "findnord-data"
  mountPath = "/app/data"

[[volumes]]
  name = "findnord-uploads"
  mountPath = "/app/uploads"

# Environment variables (set these in Railway dashboard, not here)
# Required:
# - NODE_ENV=production
# - PORT (provided by Railway)
# - OPENAI_API_KEY (for AI photo generation)
# - GOOGLE_CLIENT_ID (for Google OAuth)
# - GOOGLE_CLIENT_SECRET (for Google OAuth)
# - ADMIN_EMAIL (for admin access)
# - JWT_SECRET (for session signing)
# - AWS_REGION (for SES)
# - AWS_ACCESS_KEY_ID (for SES)
# - AWS_SECRET_ACCESS_KEY (for SES)
# - SES_FROM_EMAIL (verified sender in SES)
# - SENTRY_DSN (for error tracking)
# - STRIPE_SECRET_KEY (for Boost payments, test mode)
# - STRIPE_WEBHOOK_SECRET (for Stripe webhooks)
# - BOOST_PAYMENTS_ENABLED=false (keep off until ready)
# - SEED_DEMO_DATA=false (don't seed demo data in production)
# - DATABASE_URL (if using managed Postgres instead of SQLite volume)